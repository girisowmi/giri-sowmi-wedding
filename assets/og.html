<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    font-family: 'Cormorant Garamond', Georgia, serif;
    background:
      radial-gradient(620px 380px at 0% 0%,   rgba(242,213,220,.4), transparent 65%),
      radial-gradient(620px 380px at 100% 0%, rgba(169,191,166,.32), transparent 65%),
      radial-gradient(900px 320px at 50% 115%, rgba(227,206,156,.35), transparent 70%),
      #F6F4FF;
    display: flex; align-items: center; justify-content: center;
    text-align: center; position: relative;
  }
  .frame {
    position: absolute; inset: 26px;
    border: 1.5px solid #A5B4FC;
    border-radius: 22px;
  }
  .frame::after {
    content: ''; position: absolute; inset: 7px;
    border: 1px solid #E8D9B4; border-radius: 16px;
  }
  .inner { position: relative; padding: 0 60px; }
  .om { font-family: 'Noto Serif Tamil', serif; font-size: 34px; color: #7C3AED; line-height: 1; }
  .motto { font-family: 'Noto Serif Tamil', serif; font-size: 21px; letter-spacing: .12em; color: #4C1D95; margin-top: 12px; }
  .motto .dot { color: #6366F1; }
  .names {
    font-family: 'Great Vibes', cursive; font-weight: 400;
    font-size: 130px; line-height: 1.08; color: #241B54;
    display: flex; align-items: center; justify-content: center; gap: 28px;
    margin-top: 14px; padding-bottom: 8px;
  }
  .announce { font-size: 19px; letter-spacing: .44em; text-indent: .44em; text-transform: uppercase; color: #7C3AED; margin-top: 6px; }
  .date {
    display: inline-block; margin-top: 22px;
    border: 1.5px solid #C7BFFF; border-radius: 999px;
    padding: 12px 34px; background: rgba(255,253,248,.75);
    font-size: 21px; font-weight: 600; letter-spacing: .18em; text-transform: uppercase; color: #4C1D95;
  }
  .venues { margin-top: 24px; font-size: 20px; font-style: italic; color: #6D5FA8; line-height: 1.65; }
  .corner { position: absolute; top: 8px; width: 250px; opacity: .95; }
  .corner.tl { left: 8px; } .corner.tr { right: 8px; transform: scaleX(-1); }
</style>
</head>

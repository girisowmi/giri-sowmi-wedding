<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 420" width="300" height="420" role="img" aria-label="Coconut palm">
  <defs>
    <linearGradient id="trunk" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"   stop-color="#4C1D95"/>
      <stop offset=".45" stop-color="#7C3AED"/>
      <stop offset="1"   stop-color="#4338CA"/>
    </linearGradient>
    <linearGradient id="fr" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#60A5FA"/>
      <stop offset="1" stop-color="#4C1D95"/>
    </linearGradient>
  </defs>

  <style>
    /* the fronds sway from where they join the trunk. This lives inside the
       SVG on purpose: the file is used via &lt;img&gt;, so the page's stylesheet
       cannot reach these nodes. */
    .frond { transform-origin: 151px 170px; animation: frondsway 5s ease-in-out infinite alternate; }
    .f1 { animation-duration: 5.2s;  animation-delay: -.4s; }
    .f2 { animation-duration: 6.1s;  animation-delay: -1.9s; }
    .f3 { animation-duration: 4.6s;  animation-delay: -3.1s; }
    .f4 { animation-duration: 5.8s;  animation-delay: -2.2s; }
    .f5 { animation-duration: 6.6s;  animation-delay: -0.9s; }
    .f6 { animation-duration: 5.4s;  animation-delay: -4.0s; }
    @keyframes frondsway {
      from { transform: rotate(-2.6deg) scale(.985); }
      to   { transform: rotate(2.6deg)  scale(1.015); }
    }
    @media (prefers-reduced-motion: reduce) { .frond { animation: none; } }
  </style>

  <!-- trunk, leaning slightly like a real coconut palm -->
  <path d="M143 415 C136 320 132 240 140 168 L164 168 C160 240 158 320 161 415 Z"
        fill="url(#trunk)" opacity=".92"/>
  <g stroke="#312E81" stroke-width="1.6" opacity=".35" fill="none">
    <path d="M137 380h27M136 348h28M136 316h28M137 284h27M138 252h26M139 220h25M140 188h24"/>
  </g>

  <!-- coconuts -->
  <g fill="#3730A3">
    <circle cx="140" cy="176" r="10"/><circle cx="162" cy="180" r="9"/><circle cx="151" cy="190" r="9.5"/>
  </g>

  <!-- fronds; each sways on its own timing (see .frond in style.css) -->
  <g class="fronds" fill="url(#fr)" opacity=".95">
    <path class="frond f1" d="M151 170 C110 150 60 132 8 136 C58 108 116 122 151 156 Z"/>
    <path class="frond f2" d="M151 170 C120 128 78 92 26 74 C88 74 134 116 154 158 Z"/>
    <path class="frond f3" d="M151 170 C148 118 156 62 186 16 C196 74 178 130 158 168 Z"/>
    <path class="frond f4" d="M151 170 C186 132 232 100 288 88 C240 128 190 156 156 174 Z"/>
    <path class="frond f5" d="M151 170 C192 158 246 158 296 178 C242 194 188 188 154 178 Z"/>
    <path class="frond f6" d="M151 170 C112 172 62 184 16 208 C64 206 118 190 152 178 Z"/>
  </g>
  <circle cx="151" cy="170" r="7" fill="#312E81"/>
</svg>

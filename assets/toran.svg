<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 112" width="240" height="112">
  <!-- Tiles horizontally: the string meets both edges at y=12 so repeats join cleanly -->
  <defs>
    <radialGradient id="mgO"><stop offset="0" stop-color="#FFC44A"/><stop offset="1" stop-color="#F07E1E"/></radialGradient>
    <radialGradient id="mgY"><stop offset="0" stop-color="#FFE9A0"/><stop offset="1" stop-color="#F5B731"/></radialGradient>
    <linearGradient id="leaf" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6FA772"/><stop offset="1" stop-color="#33693F"/>
    </linearGradient>

    <g id="marigold">
      <g fill="url(#mgO)">
        <circle cx="0" cy="-7" r="6.4"/><circle cx="6.6" cy="-2.4" r="6.4"/>
        <circle cx="4.1" cy="5.7" r="6.4"/><circle cx="-4.1" cy="5.7" r="6.4"/>
        <circle cx="-6.6" cy="-2.4" r="6.4"/>
      </g>
      <g fill="url(#mgY)">
        <circle cx="0" cy="-4.2" r="4.6"/><circle cx="4" cy="1.4" r="4.6"/>
        <circle cx="-4" cy="1.4" r="4.6"/>
      </g>
      <circle r="3.1" fill="#E8891F"/>
      <circle r="1.3" fill="#B4560D"/>
    </g>

    <g id="mangoleaf">
      <path d="M0 0 C9 9 10 24 0 36 C-10 24 -9 9 0 0 Z" fill="url(#leaf)"/>
      <path d="M0 2 V33" stroke="#2A5734" stroke-width="1" opacity=".75"/>
      <path d="M0 10 5 14M0 10 -5 14M0 18 5.5 22M0 18 -5.5 22M0 26 4.5 29M0 26 -4.5 29"
            stroke="#2A5734" stroke-width=".7" opacity=".45" fill="none"/>
    </g>
  </defs>

  <!-- the hanging string -->
  <path d="M0 12 Q120 58 240 12" fill="none" stroke="#9A7B3E" stroke-width="1.8"/>

  <!-- alternating leaves and marigolds along the swag -->
  <g>
    <g transform="translate(0 12)">   <use href="#mangoleaf"/></g>
    <g transform="translate(30 22)">  <use href="#marigold" y="12"/></g>
    <g transform="translate(60 29)">  <use href="#mangoleaf"/></g>
    <g transform="translate(90 34)">  <use href="#marigold" y="13"/></g>
    <g transform="translate(120 35)"> <use href="#mangoleaf"/></g>
    <g transform="translate(150 34)"> <use href="#marigold" y="13"/></g>
    <g transform="translate(180 29)"> <use href="#mangoleaf"/></g>
    <g transform="translate(210 22)"> <use href="#marigold" y="12"/></g>
    <g transform="translate(240 12)"> <use href="#mangoleaf"/></g>
  </g>

  <!-- little buds tucked between -->
  <g fill="#F5B731" opacity=".9">
    <circle cx="15" cy="21" r="2.6"/><circle cx="45" cy="30" r="2.6"/>
    <circle cx="75" cy="36" r="2.6"/><circle cx="105" cy="39" r="2.6"/>
    <circle cx="135" cy="39" r="2.6"/><circle cx="165" cy="36" r="2.6"/>
    <circle cx="195" cy="30" r="2.6"/><circle cx="225" cy="21" r="2.6"/>
  </g>
</svg>
